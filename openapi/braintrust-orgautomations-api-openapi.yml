components:
  schemas:
    EndingBefore:
      type: string
      format: uuid
      description: 'Pagination cursor id.


        For example, if the initial item in the last page you fetched had an id of `foo`, pass `ending_before=foo` to fetch the previous page. Note: you may only pass one of `starting_after` and `ending_before`'
    CreateOrgAutomation:
      type: object
      properties:
        org_id:
          type: string
          format: uuid
          description: Unique identifier for the organization that the org automation belongs under
        name:
          type: string
          description: Name of the project automation
        description:
          type: string
          nullable: true
          description: Textual description of the project automation
        config:
          type: object
          properties:
            event_type:
              type: string
              enum:
              - retention
              description: The type of automation.
            object_type:
              $ref: '#/components/schemas/RetentionObjectType'
            retention_days:
              type: integer
              minimum: 0
              description: The number of days to retain the object
          required:
          - event_type
          - object_type
          - retention_days
          description: The configuration for the org automation rule
      required:
      - org_id
      - name
      - config
    StartingAfter:
      type: string
      format: uuid
      description: 'Pagination cursor id.


        For example, if the final item in the last page you fetched had an id of `foo`, pass `starting_after=foo` to fetch the next page. Note: you may only pass one of `starting_after` and `ending_before`'
    OrgAutomationName:
      type: string
      description: Name of the org_automation to search for
    AppLimitParam:
      type: integer
      nullable: true
      minimum: 0
      description: Limit the number of objects to return
    OrgAutomation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the project automation
        org_id:
          type: string
          format: uuid
          description: Unique identifier for the organization that the org automation belongs under
        user_id:
          type: string
          nullable: true
          format: uuid
          description: Identifies the user who created the project automation
        created:
          type: string
          nullable: true
          format: date-time
          description: Date of project automation creation
        name:
          type: string
          description: Name of the project automation
        description:
          type: string
          nullable: true
          description: Textual description of the project automation
        config:
          type: object
          properties:
            event_type:
              type: string
              enum:
              - retention
              description: The type of automation.
            object_type:
              $ref: '#/components/schemas/RetentionObjectType'
            retention_days:
              type: integer
              minimum: 0
              description: The number of days to retain the object
          required:
          - event_type
          - object_type
          - retention_days
          description: The configuration for the org automation rule
      required:
      - id
      - org_id
      - name
      - config
    OrgName:
      type: string
      description: Filter search results to within a particular organization
    Ids:
      anyOf:
      - type: string
        format: uuid
      - type: array
        items:
          type: string
          format: uuid
      description: Filter search results to a particular set of object IDs. To specify a list of IDs, include the query param multiple times
    RetentionObjectType:
      type: string
      enum:
      - project_logs
      - experiment
      - dataset
      description: The object type that the retention policy applies to
    PatchOrgAutomation:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: Name of the project automation
        description:
          type: string
          nullable: true
          description: Textual description of the project automation
        config:
          type: object
          nullable: true
          properties:
            event_type:
              type: string
              enum:
              - retention
              description: The type of automation.
            object_type:
              $ref: '#/components/schemas/RetentionObjectType'
            retention_days:
              type: integer
              minimum: 0
              description: The number of days to retain the object
          required:
          - event_type
          - object_type
          - retention_days
          description: The configuration for the org automation rule
    OrgAutomationIdParam:
      type: string
      format: uuid
      description: OrgAutomation id
  parameters:
    OrgName:
      schema:
        $ref: '#/components/schemas/OrgName'
      required: false
      description: Filter search results to within a particular organization
      name: org_name
      in: query
      allowReserved: true
    OrgAutomationName:
      schema:
        $ref: '#/components/schemas/OrgAutomationName'
      required: false
      description: Name of the org_automation to search for
      name: org_automation_name
