      responses:
        '200':
          description: Returns a list of project_automation objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectAutomation'
                    description: A list of project_automation objects
                required:
