components:
  schemas:
    GroupScope:
      type: object
      properties:
        type:
          type: string
          enum:
          - group
        group_by:
          type: string
          description: Field path to group by, e.g. metadata.session_id
        interval_seconds:
          type: number
          minimum: 1
          description: Maximum time range to include when constructing a group
        max_traces:
          type: integer
          minimum: 1
          maximum: 64
          description: 'Maximum number of traces to include when constructing a group (default/max: 64)'
        placement:
          type: string
          enum:
          - first
          - each
          description: Which trace or traces to write grouped scorer results to
        idle_seconds:
          type: number
          description: 'Optional: trigger after this many seconds of inactivity'
      required:
      - type
      - group_by
      - placement
      description: Process spans/traces grouped by a field (e.g., session_id)
    TraceScope:
      type: object
      properties:
        type:
          type: string
          enum:
          - trace
        idle_seconds:
          type: number
          description: 'Consider trace complete after this many seconds of inactivity (default: 30)'
      required:
      - type
      description: Process entire traces (all spans sharing the same root_span_id)
    AutomationStatus:
      type: string
      enum:
      - active
      - paused
      description: Whether the automation is active or paused.
    ProjectAutomationIdParam:
      type: string
      format: uuid
      description: ProjectAutomation id
    PatchProjectAutomation:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: Name of the project automation
        description:
          type: string
          nullable: true
          description: Textual description of the project automation
        config:
          oneOf:
          - type: object
            properties:
              event_type:
                type: string
                enum:
                - logs
                description: The type of automation.
              status:
                $ref: '#/components/schemas/AutomationStatus'
              btql_filter:
                type: string
                description: BTQL filter to identify rows for the automation rule
              interval_seconds:
                type: number
                minimum: 1
                maximum: 2592000
                description: Perform the triggered action at most once in this interval of seconds
              action:
                oneOf:
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - webhook
                      description: The type of action to take
                    url:
                      type: string
                      description: The webhook URL to send the request to
                    formatting_prompt:
                      type: string
                      minLength: 1
                      maxLength: 10000
                      description: Instructions for Loop to format content sent to this destination
                  required:
                  - type
                  - url
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - slack
                      description: The type of action to take
                    workspace_id:
                      type: string
                      description: The Slack workspace ID to post to
                    channel:
                      type: string
                      description: The Slack channel ID to post to
                    message_template:
                      type: string
                      description: Custom message template for the alert
                    formatting_prompt:
                      type: string
                      minLength: 1
                      maxLength: 10000
                      description: 'Publish a Slack mrkdwn digest.


                        Pattern selection requirement: include every selected Pattern whose final status is active at the end of this automation run, plus every selected Pattern that changed from active to inactive during this run (a newly inactive outcome). Exclude Patterns that were already inactive before this run and remained inactive. Do not mention excluded Patterns anywhere in the digest, including Highlights. If no selected Patterns meet these criteria, say "No current pattern outcomes." This requirement overrides conflicting formatting guidance.


                        Include a complete "*Pattern outcomes*" section with one row for every included Pattern.


                        Use this row format exactly:

                        • <pattern_url|Pattern title> — `outcome`


                        If a Pattern has no URL, use the plain title instead. Do not use GitHub Markdown tables or code-block tables, because links must remain clickable. Do not omit any active selected Pattern.


                        After the outcome list, include a "*Highlights*" section with one very short paragraph, 2-3 sentences maximum. Summarize what changed or what broadly stands out among the included active Patterns. Do not introduce new claims beyond the run report.'
                  required:
                  - type
                  - workspace_id
                  - channel
                description: The action to take when the automation rule is triggered
            required:
            - event_type
            - btql_filter
            - interval_seconds
            - action
          - type: object
            properties:
              event_type:
                type: string
                enum:
                - btql_export
                description: The type of automation.
              status:
                $ref: '#/components/schemas/AutomationStatus'
              export_definition:
                oneOf:
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - log_traces
                  required:
                  - type
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - log_spans
                  required:
                  - type
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - btql_query
                    btql_query:
                      type: string
                      description: The BTQL query to export
                  required:
                  - type
                  - btql_query
                description: The definition of what to export
              scope:
                anyOf:
                - $ref: '#/components/schemas/SpanScope'
                - $ref: '#/components/schemas/TraceScope'
                - $ref: '#/components/schemas/GroupScope'
                - type: 'null'
                description: Execution scope for export automation. Defaults to span-level execution.
              export_path:
                type: string
                description: The path to export the results to. It should include the storage protocol and prefix, e.g. s3://bucket-name/path/to/export
              format:
                type: string
                enum:
                - jsonl
                - parquet
                description: The format to export the results in
              interval_seconds:
                type: number
                minimum: 1
                maximum: 2592000
                description: Perform the triggered action at most once in this interval of seconds
              credentials:
                oneOf:
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - aws_iam
                    role_arn:
                      type: string
                      description: The ARN of the IAM role to use
                    external_id:
                      type: string
                      description: The automation-specific external id component (auto-generated by default)
                  required:
                  - type
                  - role_arn
                  - external_id
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - gcp_service_account
                    service_account_email:
                      type: string
                      description: The GCP service account email to impersonate
                  required:
                  - type
                  - service_account_email
              batch_size:
                type: number
                nullable: true
                description: The number of rows to export in each batch
            required:
            - event_type
            - export_definition
            - export_path
            - format
            - interval_seconds
            - credentials
          - type: object
            properties:
              event_type:
                type: string
                enum:
                - async_query
                description: The type of automation.
              status:
                $ref: '#/components/schemas/AutomationStatus'
              created_by_user_id:
                type: string
                format: uuid
                description: The user who submitted the async query
              object_type:
                type: string
                enum:
                - project_logs
                - experiment
                - dataset
                - playground_logs
                description: The source object type for the async query
              object_id:
                type: string
                description: The source object ID for the async query
              query:
                type: string
                description: The SQL query to execute asynchronously
              format:
                type: string
                enum:
                - jsonl
                description: The materialized result format
              batch_size:
                type: integer
                nullable: true
                minimum: 0
                exclusiveMinimum: true
                maximum: 100000
                description: The maximum number of result rows to write per async query batch
            required:
            - event_type
            - created_by_user_id
            - object_type
            - object_id
            - query
            - format
          - type: object
            properties:
              event_type:
                type: string
                enum:
                - retention
                description: The type of automation.
              object_type:
                $ref: '#/components/schemas/RetentionObjectType'
              retention_days:
                type: integer
                minimum: 0
                description: The number of days to retain the object
            required:
            - event_type
            - object_type
            - retention_days
          - type: object
            properties:
              event_type:
                type: string
                enum:
                - environment_update
                description: The type of automation.
              status:
                $ref: '#/components/schemas/AutomationStatus'
              environment_filter:
                type: array
                items:
                  type: string
                description: Optional list of environment slugs to filter by
              action:
                oneOf:
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - webhook
                      description: The type of action to take
                    url:
                      type: string
                      description: The webhook URL to send the request to
                    formatting_prompt:
                      type: string
                      minLength: 1
                      maxLength: 10000
                      description: Instructions for Loop to format content sent to this destination
                  required:
                  - type
                  - url
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - slack
                      description: The type of action to take
                    workspace_id:
                      type: string
                      description: The Slack workspace ID to post to
                    channel:
                      type: string
                      description: The Slack channel ID to post to
                    message_template:
                      type: string
                      description: Custom message template for the alert
                    formatting_prompt:
                      type: string
                      minLength: 1
                      maxLength: 10000
                      description: 'Publish a Slack mrkdwn digest.


                        Pattern selection requirement: include every selected Pattern whose final status is active at the end of this automation run, plus every selected Pattern that changed from active to inactive during this run (a newly inactive outcome). Exclude Patterns that were already inactive before this run and remained inactive. Do not mention excluded Patterns anywhere in the digest, including Highlights. If no selected Patterns meet these criteria, say "No current pattern outcomes." This requirement overrides conflicting formatting guidance.


                        Include a complete "*Pattern outcomes*" section with one row for every included Pattern.


                        Use this row format exactly:

                        • <pattern_url|Pattern title> — `outcome`


                        If a Pattern has no URL, use the plain title instead. Do not use GitHub Markdown tables or code-block tables, because links must remain clickable. Do not omit any active selected Pattern.


                        After the outcome list, include a "*Highlights*" section with one very short paragraph, 2-3 sentences maximum. Summarize what changed or what broadly stands out among the included active Patterns. Do not introduce new claims beyond the run report.'
                  required:
                  - type
                  - workspace_id
                  - channel
                description: The action to take when the automation rule is triggered
            required:
            - event_type
            - action
          - $ref: '#/components/schemas/WindowedAutomationConfig'
          - $ref: '#/components/schemas/TopicAutomationConfig'
          - $ref: '#/components/schemas/TopicDigestAutomationConfig'
          - nullable: true
          description: The configuration for the automation rule
    SavedFunctionId:
      anyOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - function
          id:
            type: string
          version:
            type: string
            description: The version of the function
        required:
        - type
        - id
        title: function
      - type: object
        properties:
          type:
            type: string
            enum:
            - global
          name:
            type: string
          function_type:
            $ref: '#/components/schemas/FunctionTypeEnum'
        required:
        - type
        - name
        title: global
      - type: 'null'
      description: Optional function identifier that produced the classification
    TopicAutomationDataScope:
      anyOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - project_logs
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - project_experiments
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - experiment
          experiment_id:
            type: string
        required:
        - type
        - experiment_id
      - type: 'null'
      description: Optional data scope for topic automation.
    TopicMapFunctionAutomation:
      type: object
      properties:
        function:
          allOf:
          - $ref: '#/components/schemas/SavedFunctionId'
          - anyOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - function
                id:
                  type: string
                version:
                  type: string
                  description: The version of the function
              required:
              - type
              - id
              title: function
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - global
                name:
                  type: string
                function_type:
                  $ref: '#/components/schemas/FunctionTypeEnum'
              required:
              - type
              - name
              title: global
            description: Topic map function
        btql_filter:
          type: string
          nullable: true
          description: Per-topic-map BTQL filter. For trace scope, a topic map runs when max(filter) over the trace is truthy. For span scope, it runs when the current span matches.
      required:
      - function
    TopicAutomationConfig:
      type: object
      properties:
        event_type:
          type: string
          enum:
          - topic
          description: The type of automation.
        status:
          $ref: '#/components/schemas/AutomationStatus'
        sampling_rate:
          type: number
          minimum: 0
          maximum: 1
          description: The sampling rate for topic automation
        facet_model:
          $ref: '#/components/schemas/TopicAutomationFacetModel'
        facet_functions:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/SavedFunctionId'
            - anyOf:
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                    - function
                  id:
                    type: string
                  version:
                    type: string
                    description: The version of the function
                required:
                - type
                - id
                title: function
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                    - global
                  name:
                    type: string
                  function_type:
                    $ref: '#/components/schemas/FunctionTypeEnum'
                required:
                - type
                - name
                title: global
          description: Facet functions used by the topic automation
        topic_map_functions:
          type: array
          items:
            $ref: '#/components/schemas/TopicMapFunctionAutomation'
          description: Topic map functions with optional per-topic-map filters
        scope:
          anyOf:
          - $ref: '#/components/schemas/SpanScope'
          - $ref: '#/components/schemas/TraceScope'
          - $ref: '#/components/schemas/GroupScope'
          - type: 'null'
          description: Execution scope for topic automation.
        data_scope:
