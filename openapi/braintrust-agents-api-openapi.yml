    patch:
      operationId: patchAgentId
      tags:
      - Agents
      description: Partially update a agent object. Specify the fields to update in the payload. Any object-type fields will be deep-merged with existing content. Currently we do not support removing fields or setting them to null.
      summary: Partially update agent
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/AgentIdParam'
      requestBody:
        description: Fields to update
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAgent'
      responses:
        '200':
          description: Returns the agent object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: The request was unacceptable, often due to missing a required parameter
          content:
