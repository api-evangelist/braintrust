components:
  schemas:
    EndingBefore:
      type: string
      format: uuid
      description: 'Pagination cursor id.


        For example, if the initial item in the last page you fetched had an id of `foo`, pass `ending_before=foo` to fetch the previous page. Note: you may only pass one of `starting_after` and `ending_before`'
    AgentName:
      type: string
      description: Name of the agent to search for
    PatchAgent:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: Name of the agent. Within a project, agent names are unique
        description:
          type: string
          nullable: true
          description: Textual description of the agent
        metadata:
          type: object
          nullable: true
          additionalProperties:
            nullable: true
          description: User-controlled metadata about the agent
      description: An agent is a project-scoped durable object that identifies an AI agent or service emitting spans
    StartingAfter:
      type: string
      format: uuid
      description: 'Pagination cursor id.


        For example, if the final item in the last page you fetched had an id of `foo`, pass `starting_after=foo` to fetch the next page. Note: you may only pass one of `starting_after` and `ending_before`'
    CreateAgent:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
          description: Unique identifier for the project that the agent belongs under
        name:
          type: string
          description: Name of the agent. Within a project, agent names are unique
        description:
          type: string
          nullable: true
          description: Textual description of the agent
        metadata:
          type: object
          nullable: true
          additionalProperties:
            nullable: true
          description: User-controlled metadata about the agent
      required:
      - project_id
      - name
      description: An agent is a project-scoped durable object that identifies an AI agent or service emitting spans
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the agent
        project_id:
          type: string
          format: uuid
          description: Unique identifier for the project that the agent belongs under
        user_id:
          type: string
          format: uuid
        created:
          type: string
          nullable: true
          format: date-time
          description: Date of agent creation
        name:
          type: string
          description: Name of the agent. Within a project, agent names are unique
        slug:
          type: string
          description: Stable, URL-safe identifier for the agent, unique within its project.
        kind:
          type: string
          description: 'Agent classification: ''custom'' for customer-defined agents, ''loop'' for built-in Loop agents.'
        description:
          type: string
          nullable: true
          description: Textual description of the agent
        metadata:
          type: object
          nullable: true
          additionalProperties:
            nullable: true
          description: User-controlled metadata about the agent
      required:
      - id
      - project_id
      - user_id
      - name
      - slug
      - kind
      description: An agent is a project-scoped durable object that identifies an AI agent or service emitting spans
    AppLimitParam:
      type: integer
      nullable: true
      minimum: 0
      description: Limit the number of objects to return
    OrgName:
      type: string
      description: Filter search results to within a particular organization
    Ids:
      anyOf:
      - type: string
        format: uuid
      - type: array
        items:
          type: string
          format: uuid
      description: Filter search results to a particular set of object IDs. To specify a list of IDs, include the query param multiple times
    AgentIdParam:
      type: string
      format: uuid
      description: Agent id
  parameters:
    OrgName:
      schema:
        $ref: '#/components/schemas/OrgName'
      required: false
      description: Filter search results to within a particular organization
      name: org_name
      in: query
      allowReserved: true
    AgentIdParam:
      schema:
        $ref: '#/components/schemas/AgentIdParam'
      required: true
      description: Agent id
      name: agent_id
      in: path
    Ids:
      schema:
        $ref: '#/components/schemas/Ids'
      required: false
      description: Filter search results to a particular set of object IDs. To specify a list of IDs, include the query param multiple times
      name: ids
      in: query
    StartingAfter:
      schema:
        $ref: '#/components/schemas/StartingAfter'
      required: false
      description: 'Pagination cursor id.


        For example, if the final item in the last page you fetched had an id of `foo`, pass `starting_after=foo` to fetch the next page. Note: you may only pass one of `starting_after` and `ending_before`'
      name: starting_after
      in: query
    AgentName:
      schema:
        $ref: '#/components/schemas/AgentName'
      required: false
      description: Name of the agent to search for
      name: agent_name
      in: query
      allowReserved: true
    AppLimitParam:
      schema:
        $ref: '#/components/schemas/AppLimitParam'
      required: false
      description: Limit the number of objects to return
      name: limit
      in: query
    EndingBefore:
      schema:
        $ref: '#/components/schemas/EndingBefore'
      required: false
      description: 'Pagination cursor id.


        For example, if the initial item in the last page you fetched had an id of `foo`, pass `ending_before=foo` to fetch the previous page. Note: you may only pass one of `starting_after` and `ending_before`'
      name: ending_before
      in: query
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key or JWT
      description: 'Most Braintrust endpoints are authenticated by providing your API key as a header `Authorization: Bearer [api_key]` to your HTTP request. You can create an API key in the Braintrust [organization settings page](https://www.braintrustdata.com/app/settings?subroute=api-keys).'
