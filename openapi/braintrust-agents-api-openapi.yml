    delete:
      operationId: deleteAgentId
      tags:
      - Agents
      description: Delete a agent object by its id
      summary: Delete agent
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/AgentIdParam'
      responses:
