components:
  schemas:
    EndingBefore:
      type: string
      format: uuid
      description: 'Pagination cursor id.


        For example, if the initial item in the last page you fetched had an id of `foo`, pass `ending_before=foo` to fetch the previous page. Note: you may only pass one of `starting_after` and `ending_before`'
    ProjectGroupName:
      type: string
      description: Name of the project_group to search for
    StartingAfter:
      type: string
      format: uuid
      description: 'Pagination cursor id.


        For example, if the final item in the last page you fetched had an id of `foo`, pass `starting_after=foo` to fetch the next page. Note: you may only pass one of `starting_after` and `ending_before`'
    ProjectGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the project group
        org_id:
          type: string
          format: uuid
          description: 'Unique id for the organization that the project group belongs under


            It is forbidden to change the org after creating a project group'
        user_id:
          type: string
          nullable: true
          format: uuid
          description: Identifies the user who created the project group
        created:
          type: string
          nullable: true
          format: date-time
          description: Date of project group creation
        name:
          type: string
          description: Name of the project group
        description:
          type: string
          nullable: true
          description: Textual description of the project group
        deleted_at:
          type: string
          nullable: true
          format: date-time
          description: Date of project group deletion, or null if the project group is still active
        member_projects:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10000
          description: Sorted ids of active projects in this project group
      required:
      - id
      - org_id
      - name
      - member_projects
      description: A project group is a collection of projects which can inherit access from project-group ACLs
    AppLimitParam:
      type: integer
      nullable: true
      minimum: 0
      description: Limit the number of objects to return
    OrgName:
      type: string
      description: Filter search results to within a particular organization
    PatchProjectGroup:
      type: object
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          description: Name of the project group
        description:
          type: string
          nullable: true
          description: Textual description of the project group
        add_member_projects:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          maxItems: 1000
          description: A list of project IDs to add to the project group
        remove_member_projects:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          maxItems: 1000
          description: A list of project IDs to remove from the project group
    Ids:
      anyOf:
      - type: string
        format: uuid
      - type: array
        items:
          type: string
          format: uuid
      description: Filter search results to a particular set of object IDs. To specify a list of IDs, include the query param multiple times
    CreateProjectGroup:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the project group
        description:
          type: string
          nullable: true
          description: Textual description of the project group
        org_name:
          type: string
          nullable: true
          description: For nearly all users, this parameter should be unnecessary. But in the rare case that your API key belongs to multiple organizations, you may specify the name of the organization the project group belongs in.
      required:
      - name
    ProjectGroupIdParam:
      type: string
      format: uuid
      description: ProjectGroup id
  parameters:
    OrgName:
      schema:
        $ref: '#/components/schemas/OrgName'
      required: false
      description: Filter search results to within a particular organization
      name: org_name
      in: query
      allowReserved: true
    Ids:
      schema:
        $ref: '#/components/schemas/Ids'
      required: false
      description: Filter search results to a particular set of object IDs. To specify a list of IDs, include the query param multiple times
      name: ids
      in: query
    ProjectGroupIdParam:
      schema:
        $ref: '#/components/schemas/ProjectGroupIdParam'
      required: true
      description: ProjectGroup id
      name: project_group_id
      in: path
    ProjectGroupName:
      schema:
        $ref: '#/components/schemas/ProjectGroupName'
      required: false
      description: Name of the project_group to search for
      name: project_group_name
      in: query
      allowReserved: true
    StartingAfter:
      schema:
        $ref: '#/components/schemas/StartingAfter'
      required: false
      description: 'Pagination cursor id.


        For example, if the final item in the last page you fetched had an id of `foo`, pass `starting_after=foo` to fetch the next page. Note: you may only pass one of `starting_after` and `ending_before`'
      name: starting_after
      in: query
    AppLimitParam:
      schema:
        $ref: '#/components/schemas/AppLimitParam'
      required: false
      description: Limit the number of objects to return
      name: limit
      in: query
    EndingBefore:
      schema:
        $ref: '#/components/schemas/EndingBefore'
      required: false
      description: 'Pagination cursor id.


        For example, if the initial item in the last page you fetched had an id of `foo`, pass `ending_before=foo` to fetch the previous page. Note: you may only pass one of `starting_after` and `ending_before`'
      name: ending_before
      in: query
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key or JWT
      description: 'Most Braintrust endpoints are authenticated by providing your API key as a header `Authorization: Bearer [api_key]` to your HTTP request. You can create an API key in the Braintrust [organization settings page](https://www.braintrustdata.com/app/settings?subroute=api-keys).'
