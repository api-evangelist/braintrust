  title: Braintrust Service Tokens API
  description: 'API specification for the backend data server. The API is hosted globally at

    https://api.braintrust.dev or in your own environment.


    You can access the OpenAPI spec for this API at https://github.com/braintrustdata/braintrust-openapi.'
  license:
    name: Apache 2.0
servers:
- url: https://api.braintrust.dev
security:
- bearerAuth: []
- {}
tags:
- name: Service Tokens
paths:
  /v1/service_token:
    post:
      tags:
      - Service Tokens
      security:
      - bearerAuth: []
      - {}
      operationId: postServiceToken
      description: 'Create a new service token.


        When calling this endpoint, you must authenticate using a service token that has organization-owner permissions. User API keys cannot be used.'
      summary: Create service_token
      requestBody:
        description: Any desired information about the new service_token object
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the service token. Does not have to be unique
                org_name:
                  type: string
                  nullable: true
                  description: For nearly all users, this parameter should be unnecessary. But in the rare case that your API key belongs to multiple organizations, you may specify the name of the organization the Service token belongs in.
                service_account_id:
                  type: string
                  description: The ID of the service account to which the token should belong. To create a service account, visit [**Settings > Service tokens**](https://www.braintrust.dev/app/~/configuration/org/service-tokens) in the Braintrust UI or call [`PATCH /v1/organization/members`](https://www.braintrust.dev/docs/api-reference/organizations/modify-organization-membership).
                expires_in_seconds:
                  type: integer
                  nullable: true
                  minimum: 0
                  exclusiveMinimum: true
                  description: Number of seconds from now after which the service token should expire. If omitted, the token never expires.
              required:
              - name
              - service_account_id
      responses:
        '200':
          description: Returns an object containing the raw service token. This is the only time the raw API key will be exposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceTokenOutput'
        '400':
          description: The request was unacceptable, often due to missing a required parameter
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                nullable: true
        '401':
          description: No valid API key provided
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                nullable: true
        '403':
          description: The API key doesn’t have permissions to perform the request
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                nullable: true
        '429':
          description: Too many requests hit the API too quickly. We recommend an exponential backoff of your requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                nullable: true
        '500':
          description: Something went wrong on Braintrust's end. (These are rare.)
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                nullable: true
