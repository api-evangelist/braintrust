      - {}
      operationId: putServiceToken
      description: Create or replace service_token. If there is an existing service_token with the same name as the one specified in the request, will replace the existing service_token with the provided fields
      summary: Create or replace service_token
      requestBody:
        description: Any desired information about the new service_token object
        required: true
